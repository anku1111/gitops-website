apiVersion: apps/v1
kind: Deployment

metadata:
  name: php-website

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: php-website

  template:
    metadata:
      labels:
        app: php-website

    spec:
      containers:
      - name: php-website

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        ports:
        - containerPort: {{ .Values.container.port }}